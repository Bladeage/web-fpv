name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (dist/fpvsim.html, dist/fpvsim.aspx)
        run: node tools/build.mjs
      - name: Tests
        run: node --test "test/*.test.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: fpvsim-dist
          path: dist/

  # Veröffentlicht dist/ auf GitHub Pages, nur bei Push auf den Standard-Branch.
  pages:
    needs: build-test
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fpvsim-dist
          path: dist
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp dist/fpvsim.html _site/index.html
          cp dist/fpvsim.html dist/fpvsim.aspx _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
