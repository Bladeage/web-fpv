name: CI

on:
  push:
    paths-ignore: ['docs/**', '**.md']   # reine Doku-Änderungen brauchen keinen Lauf (spart Minuten, Nutzer 09.11.2026)
  pull_request:
    paths-ignore: ['docs/**', '**.md']

# Ein neuer Push bricht den noch laufenden Lauf desselben Branches ab
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ganze Historie: die Versionsnummer zählt die Commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (dist/fpvsim.html, dist/fpvsim.aspx)
        run: node tools/build.mjs
      - name: Tests
        run: node --test "test/*.test.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: fpvsim-dist
          path: dist/

  # Veröffentlicht dist/ auf GitHub Pages, nur bei Push auf den Standard-Branch.
  pages:
    needs: build-test
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fpvsim-dist
          path: dist
      # index.html ist der Simulator; fpvsim.html nur eine Weiterleitung (alte Links), statt die 6,5 MB doppelt hochzuladen
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp dist/fpvsim.html _site/index.html
          cp dist/fpvsim.aspx _site/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./"><title>FPV-Simulator</title><a href="./">FPV-Simulator</a>\n' > _site/fpvsim.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000   # 20 min: GitHub brauchte beim Abgleich zweimal länger als die vorgegebenen 10 min (06.11.2026)
