name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (dist/fpvsim.html, dist/fpvsim.aspx)
        run: node tools/build.mjs
      - name: Tests
        run: node --test "test/*.test.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: fpvsim-dist
          path: dist/
