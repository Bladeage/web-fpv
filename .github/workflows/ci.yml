name: CI

on:
  push:
    paths-ignore: ['docs/**', '**.md']   # reine Doku-Änderungen brauchen keinen Lauf (spart Minuten, Nutzer 09.11.2026)
  pull_request:
    paths-ignore: ['docs/**', '**.md']

# Ein neuer Push bricht den noch laufenden Lauf desselben Branches ab
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ganze Historie: die Versionsnummer zählt die Commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (dist/fpvsim.html, dist/fpvsim.aspx)
        run: node tools/build.mjs
      - name: Tests
        run: node --test "test/*.test.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: fpvsim-dist
          path: dist/

  # Veröffentlicht dist/ auf GitHub Pages, nur bei Push auf den Standard-Branch.
  pages:
    needs: build-test
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fpvsim-dist
          path: dist
      # index.html ist der Simulator; fpvsim.html nur eine Weiterleitung (alte Links), statt die 6,5 MB doppelt hochzuladen
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp dist/fpvsim.html _site/index.html
          cp dist/fpvsim.aspx _site/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./"><title>FPV-Simulator</title><a href="./">FPV-Simulator</a>\n' > _site/fpvsim.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Ausliefern mit zweitem Versuch (25.11.2026): Zweimal an einem Abend scheiterte der Schritt mit „Fetching artifact metadata
      # failed“, 0,4 s nach dem Hochladen des Pakets. Build und Tests waren grün, die Seite blieb aber auf dem alten Stand.
      # Darum kurz warten, bei einem Fehler nach 30 s noch einmal versuchen und am Ende die ausgelieferte Seite prüfen.
      - name: Kurz warten, bis GitHub das Paket kennt
        run: sleep 10
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000   # 10 min ist das erlaubte Höchstmaß (mehr kürzt GitHub selbst)
      - name: Vor dem zweiten Versuch warten
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        name: Ausliefern, zweiter Versuch
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      # Prüfen, was wirklich ausgeliefert wird: Die Seite trägt im Hauptmenü den Kurz-Hash des gebauten Commits (tools/build.mjs).
      # Bis zu 5 min lang alle 15 s abrufen (mit wechselnder Adresse, damit kein Zwischenspeicher antwortet). Ohne Treffer: Lauf rot.
      - name: Ausgelieferte Seite prüfen
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
        run: |
          want="${GITHUB_SHA::7}"
          url="${PAGE_URL:-https://bladeage.github.io/web-fpv/}"
          for i in $(seq 1 20); do
            if curl -fsS -m 30 -o seite.html "${url}?v=${GITHUB_SHA}-${i}" && grep -q "$want" seite.html; then echo "Live: Stand $want ist ausgeliefert (Versuch $i)."; exit 0; fi
            sleep 15
          done
          echo "::error::Die Seite ${url} zeigt nach 5 Minuten nicht den Stand $want."
          exit 1
